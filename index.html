<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>클리닉 운영 표준안 준수 대시보드</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Serif+KR:wght@500;700;900&family=Noto+Sans+KR:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<style>
  :root{
    --paper:#EEF1F4;
    --card:#FFFFFF;
    --ink:#16223D;
    --ink-soft:#5B6472;
    --ink-faint:#8A93A3;
    --line:#DCE1E8;
    --line-strong:#C3CBD6;
    --jade:#2C6E5C;
    --jade-bg:#E3EFEA;
    --amber:#A8752B;
    --amber-bg:#F5ECDA;
    --red:#AB4234;
    --red-bg:#F5E3DF;
    --navy-deep:#101B33;
    --navy-mid:#1C2C4E;
    --gold:#B8862E;
    --radius:14px;
    --radius-sm:8px;
    --shadow:0 1px 2px rgba(16,27,51,0.06), 0 8px 24px -12px rgba(16,27,51,0.18);
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    background:var(--paper);
    color:var(--ink);
    font-family:'Noto Sans KR',-apple-system,BlinkMacSystemFont,sans-serif;
    -webkit-font-smoothing:antialiased;
    min-height:100vh;
  }
  ::selection{background:var(--gold); color:#fff;}
  button{font-family:inherit;}
  input,select,textarea{font-family:inherit;}
  a{color:inherit;}

  /* ---------- Layout shell ---------- */
  #app{max-width:1180px;margin:0 auto;padding:0 20px 80px;}

  .letterhead{
    background:linear-gradient(160deg, var(--navy-deep) 0%, var(--navy-mid) 100%);
    color:#EDEFF5;
    margin:0 -20px;
    padding:34px 20px 26px;
    position:relative;
    overflow:hidden;
  }
  .letterhead::after{
    content:'';
    position:absolute; inset:0;
    background-image: repeating-linear-gradient(90deg, rgba(255,255,255,0.035) 0px, rgba(255,255,255,0.035) 1px, transparent 1px, transparent 64px);
    pointer-events:none;
  }
  .letterhead-inner{max-width:1180px;margin:0 auto;position:relative; display:flex; justify-content:space-between; align-items:flex-end; gap:24px; flex-wrap:wrap;}
  .letterhead-eyebrow{font-size:12px; letter-spacing:2.5px; color:#9FB0CE; text-transform:uppercase; font-weight:600; margin-bottom:10px;}
  .letterhead h1{
    font-family:'Noto Serif KR',serif; font-weight:700; font-size:30px; line-height:1.3;
    margin:0 0 8px; letter-spacing:-0.2px;
  }
  .letterhead p.sub{margin:0; font-size:14px; color:#B7C2D9;}
  .hero-stamp-wrap{display:flex; align-items:center; gap:16px; flex-shrink:0;}
  .hero-stamp-caption{text-align:right; font-size:12px; color:#9FB0CE; line-height:1.6;}
  .hero-stamp-caption b{display:block; color:#EDEFF5; font-size:13px; font-weight:600;}

  /* ---------- Stamp component ---------- */
  .stamp{
    --c: var(--jade);
    border-radius:50%;
    border:6px double var(--c);
    color:var(--c);
    display:flex; flex-direction:column; align-items:center; justify-content:center;
    font-family:'Noto Serif KR',serif;
    transform:rotate(-8deg);
    mix-blend-mode:multiply;
    background:transparent;
    flex-shrink:0;
    line-height:1.05;
  }
  .stamp.tone-jade{--c:var(--jade);}
  .stamp.tone-amber{--c:var(--amber);}
  .stamp.tone-red{--c:var(--red);}
  .stamp.tone-grey{--c:#9AA3B2; border-style:dashed; mix-blend-mode:normal;}
  .stamp-lg{width:96px; height:96px;}
  .stamp-lg .stamp-num{font-size:26px; font-weight:900;}
  .stamp-lg .stamp-label{font-size:10.5px; letter-spacing:1.5px; margin-top:2px;}
  .stamp-md{width:56px; height:56px;}
  .stamp-md .stamp-num{font-size:16px; font-weight:800;}
  .stamp-md .stamp-label{font-size:8px; letter-spacing:1px; margin-top:1px;}
  .stamp-sm{width:42px; height:42px; border-width:4px;}
  .stamp-sm .stamp-num{font-size:12px; font-weight:800;}
  .stamp-sm .stamp-label{font-size:6.5px; letter-spacing:0.5px; margin-top:0px;}

  /* ---------- Tabs ---------- */
  .tabbar{
    display:flex; gap:4px; margin-top:22px; border-bottom:1px solid var(--line-strong);
    overflow-x:auto;
  }
  .tab-btn{
    appearance:none; border:none; background:transparent; cursor:pointer;
    padding:12px 18px 13px; font-size:14.5px; font-weight:600; color:var(--ink-soft);
    border-bottom:3px solid transparent; white-space:nowrap;
    transition:color .15s ease, border-color .15s ease;
  }
  .tab-btn:hover{color:var(--ink);}
  .tab-btn.active{color:var(--navy-deep); border-bottom-color:var(--gold);}
  .tab-btn:focus-visible{outline:2px solid var(--gold); outline-offset:2px;}

  .view{padding-top:24px;}

  /* ---------- Cards / stats ---------- */
  .stats-row{display:grid; grid-template-columns:repeat(auto-fit,minmax(150px,1fr)); gap:14px; margin-bottom:22px;}
  .stat-card{
    background:var(--card); border:1px solid var(--line); border-radius:var(--radius);
    padding:16px 18px; box-shadow:var(--shadow);
  }
  .stat-card .stat-label{font-size:12px; color:var(--ink-faint); font-weight:600; letter-spacing:.3px; margin-bottom:6px;}
  .stat-card .stat-value{font-family:'Noto Serif KR',serif; font-size:28px; font-weight:700; color:var(--ink);}
  .stat-card .stat-value.jade{color:var(--jade);}
  .stat-card .stat-value.red{color:var(--red);}
  .stat-card .stat-sub{font-size:11.5px; color:var(--ink-faint); margin-top:4px;}

  .card{background:var(--card); border:1px solid var(--line); border-radius:var(--radius); box-shadow:var(--shadow);}

  /* ---------- Filter bar ---------- */
  .filter-bar{
    display:flex; gap:10px; align-items:center; flex-wrap:wrap;
    padding:14px 16px; margin-bottom:14px;
  }
  .filter-bar select, .filter-bar input[type=text]{
    border:1px solid var(--line-strong); border-radius:8px; padding:8px 10px;
    font-size:13.5px; color:var(--ink); background:#fff;
  }
  .filter-bar select:focus, .filter-bar input:focus{outline:2px solid var(--gold); outline-offset:1px;}
  .filter-bar .spacer{flex:1;}
  .btn{
    appearance:none; cursor:pointer; border:1px solid var(--line-strong); background:#fff;
    border-radius:8px; padding:8px 14px; font-size:13.5px; font-weight:600; color:var(--ink);
    transition:background .15s ease, border-color .15s ease;
  }
  .btn:hover{background:#F5F7FA;}
  .btn:focus-visible{outline:2px solid var(--gold); outline-offset:2px;}
  .btn-primary{background:var(--navy-deep); border-color:var(--navy-deep); color:#fff;}
  .btn-primary:hover{background:var(--navy-mid);}
  .btn-primary:disabled{background:#B9C0CC; border-color:#B9C0CC; cursor:not-allowed;}
  .btn-gold{background:var(--gold); border-color:var(--gold); color:#fff;}
  .btn-gold:hover{filter:brightness(1.05);}
  .btn-ghost{background:transparent; border-color:transparent; color:var(--ink-soft); padding:8px 10px;}
  .btn-ghost:hover{color:var(--ink); background:#F0F2F6;}
  .btn-sm{padding:5px 10px; font-size:12.5px;}

  /* ---------- Table ---------- */
  table.data{width:100%; border-collapse:collapse; font-size:13.5px;}
  table.data thead th{
    text-align:left; font-size:11.5px; text-transform:uppercase; letter-spacing:.5px;
    color:var(--ink-faint); font-weight:700; padding:0 16px 10px; border-bottom:1px solid var(--line-strong);
  }
  table.data tbody td{padding:12px 16px; border-bottom:1px solid var(--line); vertical-align:middle;}
  table.data tbody tr:hover{background:#F7F9FB;}
  table.data tbody tr:last-child td{border-bottom:none;}
  .branch-name{font-weight:700; color:var(--ink);}
  .type-chip{
    display:inline-block; padding:2px 8px; border-radius:20px; font-size:11.5px; font-weight:700;
    background:#EEF1F4; color:var(--ink-soft); border:1px solid var(--line-strong);
  }
  .type-chip.na{color:var(--ink-faint); font-style:italic; font-weight:500; border-style:dashed;}
  .tag-fail{
    display:inline-block; font-size:11px; padding:2px 7px; margin:1px 3px 1px 0; border-radius:6px;
    background:var(--red-bg); color:var(--red); font-weight:600;
  }
  .muted{color:var(--ink-faint);}
  .row-flex{display:flex; align-items:center; gap:10px;}
  .gap-flag{color:var(--red); font-weight:700; font-size:12px;}
  .role-chip{display:inline-block; font-size:10.5px; font-weight:800; padding:2px 8px; border-radius:20px; letter-spacing:.3px;}
  .role-chip.manager{background:#E3E8F2; color:var(--navy-mid);}
  .role-chip.director{background:var(--amber-bg); color:var(--amber);}
  .role-toggle{display:flex; border:1px solid var(--line-strong); border-radius:8px; overflow:hidden;}
  .role-toggle button{flex:1; appearance:none; border:none; padding:9px 10px; font-size:13px; font-weight:700; cursor:pointer; background:#fff; color:var(--ink-soft); border-left:1px solid var(--line-strong);}
  .role-toggle button:first-child{border-left:none;}
  .role-toggle button.active.manager{background:#E3E8F2; color:var(--navy-mid);}
  .role-toggle button.active.director{background:var(--amber-bg); color:var(--amber);}
  .detail-tabs{display:flex; gap:6px; margin-bottom:14px; flex-wrap:wrap;}
  .detail-tabs button{appearance:none; border:1px solid var(--line-strong); background:#fff; border-radius:20px; padding:6px 13px; font-size:12.5px; font-weight:700; color:var(--ink-soft); cursor:pointer;}
  .detail-tabs button.active{background:var(--navy-deep); border-color:var(--navy-deep); color:#fff;}

  /* ---------- Empty state ---------- */
  .empty-state{
    text-align:center; padding:60px 20px; color:var(--ink-soft);
  }
  .empty-state .stamp{margin:0 auto 18px;}
  .empty-state h3{font-family:'Noto Serif KR',serif; font-size:19px; color:var(--ink); margin:0 0 8px;}
  .empty-state p{font-size:13.5px; margin:0 0 18px; color:var(--ink-faint);}

  /* ---------- Eval form ---------- */
  .eval-shell{display:grid; grid-template-columns:280px 1fr; gap:20px; align-items:start;}
  @media (max-width:900px){.eval-shell{grid-template-columns:1fr;}}
  .eval-side{position:sticky; top:20px;}
  .field{margin-bottom:16px;}
  .field label{display:block; font-size:12.5px; font-weight:700; color:var(--ink-soft); margin-bottom:6px;}
  .field select, .field input[type=text], .field input[type=date], .field textarea{
    width:100%; border:1px solid var(--line-strong); border-radius:8px; padding:9px 11px; font-size:14px; color:var(--ink); background:#fff;
  }
  .field select:focus, .field input:focus, .field textarea:focus{outline:2px solid var(--gold); outline-offset:1px;}
  .field textarea{resize:vertical; min-height:70px;}
  .type-banner{
    border:1px solid var(--line-strong); border-radius:10px; padding:12px 14px; font-size:12.5px; color:var(--ink-soft); background:#F7F9FB; margin-bottom:16px;
  }
  .type-banner b{color:var(--ink);}
  .progress-track{height:6px; background:var(--line); border-radius:4px; overflow:hidden; margin:8px 0 4px;}
  .progress-fill{height:100%; background:var(--gold); transition:width .2s ease;}

  .cat-block{margin-bottom:22px;}
  .cat-title{
    font-family:'Noto Serif KR',serif; font-weight:700; font-size:15px; color:var(--navy-deep);
    display:flex; align-items:center; gap:8px; margin-bottom:10px; padding-bottom:6px; border-bottom:1px solid var(--line);
  }
  .cat-count{font-family:'Noto Sans KR'; font-weight:600; font-size:11px; color:#fff; background:var(--navy-deep); border-radius:20px; padding:1px 8px;}
  .check-item{
    display:flex; justify-content:space-between; align-items:center; gap:16px;
    padding:11px 4px; border-bottom:1px dashed var(--line);
  }
  .check-item:last-child{border-bottom:none;}
  .check-item-text .ci-label{font-weight:700; font-size:13.5px; color:var(--ink);}
  .check-item-text .ci-desc{font-size:12px; color:var(--ink-faint); margin-top:2px; max-width:440px;}
  .seg{display:flex; border:1px solid var(--line-strong); border-radius:8px; overflow:hidden; flex-shrink:0;}
  .seg button{
    appearance:none; border:none; background:#fff; padding:7px 12px; font-size:12px; font-weight:700; cursor:pointer;
    color:var(--ink-faint); border-left:1px solid var(--line-strong); transition:background .12s ease, color .12s ease;
  }
  .seg button:first-child{border-left:none;}
  .seg button:focus-visible{outline:2px solid var(--gold); outline-offset:-2px;}
  .seg button.opt-pass.active{background:var(--jade-bg); color:var(--jade);}
  .seg button.opt-fail.active{background:var(--red-bg); color:var(--red);}
  .seg button.opt-na.active{background:#EFEFEF; color:var(--ink-soft);}
  .seg button:not(.active):hover{background:#F5F7FA; color:var(--ink-soft);}

  .submit-bar{
    position:sticky; bottom:0; background:var(--card); border-top:1px solid var(--line);
    margin:0 -1px -1px; padding:14px 16px; display:flex; align-items:center; justify-content:space-between; border-radius:0 0 var(--radius) var(--radius);
  }

  /* ---------- Settings table ---------- */
  .settings-note{font-size:12.5px; color:var(--ink-faint); padding:0 16px 12px;}
  .settings-note b{color:var(--ink-soft);}
  select.inline-select, input.inline-text{
    border:1px solid var(--line-strong); border-radius:6px; padding:6px 8px; font-size:13px; background:#fff; width:100%;
  }
  select.inline-select:focus, input.inline-text:focus{outline:2px solid var(--gold); outline-offset:1px;}
  .dirty-banner{
    display:flex; align-items:center; justify-content:space-between; gap:12px;
    background:var(--amber-bg); color:#7A5A1E; border:1px solid #E4CE9C; border-radius:10px;
    padding:10px 14px; font-size:13px; margin-bottom:14px; font-weight:600;
  }

  /* ---------- Modal / detail panel ---------- */
  .modal-backdrop{
    position:fixed; inset:0; background:rgba(16,20,32,0.5); z-index:50;
    display:flex; justify-content:flex-end;
    animation:fadeIn .15s ease;
  }
  @keyframes fadeIn{from{opacity:0;} to{opacity:1;}}
  .modal-panel{
    width:min(560px, 100%); background:var(--paper); height:100%; overflow-y:auto;
    box-shadow:-12px 0 40px rgba(0,0,0,0.25);
    animation:slideIn .2s ease;
  }
  @keyframes slideIn{from{transform:translateX(24px); opacity:0;} to{transform:translateX(0); opacity:1;}}
  .modal-head{
    background:linear-gradient(160deg, var(--navy-deep), var(--navy-mid)); color:#fff; padding:22px 22px 20px;
    display:flex; justify-content:space-between; align-items:flex-start; gap:14px;
  }
  .modal-head h2{font-family:'Noto Serif KR',serif; font-size:20px; margin:0 0 4px;}
  .modal-head .meta{font-size:12.5px; color:#B7C2D9;}
  .modal-close{background:rgba(255,255,255,0.12); border:none; color:#fff; width:30px; height:30px; border-radius:50%; cursor:pointer; font-size:15px; flex-shrink:0;}
  .modal-close:hover{background:rgba(255,255,255,0.22);}
  .modal-body{padding:20px 22px 40px;}
  .hist-entry{border:1px solid var(--line); border-radius:10px; margin-bottom:10px; overflow:hidden; background:#fff;}
  .hist-summary{display:flex; align-items:center; gap:12px; padding:12px 14px; cursor:pointer;}
  .hist-summary:hover{background:#F7F9FB;}
  .hist-detail{padding:4px 14px 14px; border-top:1px dashed var(--line); display:none;}
  .hist-detail.open{display:block;}
  .hist-detail .mini-item{display:flex; justify-content:space-between; gap:10px; padding:6px 0; font-size:12.5px; border-bottom:1px solid #F0F2F5;}
  .hist-detail .mini-item:last-child{border-bottom:none;}
  .mini-badge{font-size:10.5px; font-weight:800; padding:1px 7px; border-radius:5px; flex-shrink:0;}
  .mini-badge.pass{background:var(--jade-bg); color:var(--jade);}
  .mini-badge.fail{background:var(--red-bg); color:var(--red);}
  .mini-badge.na{background:#EFEFEF; color:var(--ink-faint);}

  .toast{
    position:fixed; bottom:24px; left:50%; transform:translateX(-50%);
    background:var(--navy-deep); color:#fff; padding:11px 20px; border-radius:30px; font-size:13.5px; font-weight:600;
    box-shadow:0 8px 24px rgba(0,0,0,0.25); z-index:100; opacity:0; pointer-events:none; transition:opacity .2s ease, transform .2s ease;
  }
  .toast.show{opacity:1; transform:translateX(-50%) translateY(-4px);}

  .footnote{text-align:center; font-size:11.5px; color:var(--ink-faint); margin-top:34px; padding-top:16px; border-top:1px solid var(--line);}

  .loading-wrap{padding:100px 20px; text-align:center; color:var(--ink-faint); font-size:13.5px;}

  ::-webkit-scrollbar{width:9px; height:9px;}
  ::-webkit-scrollbar-thumb{background:#C6CCD8; border-radius:6px;}
</style>
</head>
<body>
<div id="app"><div class="loading-wrap">불러오는 중입니다…</div></div>
<div id="modal-root"></div>
<div class="toast" id="toast"></div>

<script>
/* =====================================================================
   상수 정의

const APPS_SCRIPT_URL = 'https://script.google.com/macros/s/AKfycbwUvTttE8ClH6DTXnC3KZaGlnd29hIrAk3lFsyRT9hti3bYo36xjaejwam61XrWXRF0/exec';

  : (typeof window.storage !== 'undefined') ? 'claude' : 'local';

function makeLocalStorageShim(){
  const PFX = 'clinicDash::';
  return {
    async get(key){
      const raw = localStorage.getItem(PFX+key);
      if(raw===null){ throw new Error('key not found: '+key); }
      return {key, value: raw, shared:false};
    },
    async set(key, value){
      localStorage.setItem(PFX+key, value);
      return {key, value, shared:false};
    },
    async delete(key){
      localStorage.removeItem(PFX+key);
      return {key, deleted:true, shared:false};
    },
    async list(prefix){
      const keys=[];
      for(let i=0;i<localStorage.length;i++){
        const k = localStorage.key(i);
        if(k && k.indexOf(PFX)===0){
          const bare = k.slice(PFX.length);
          if(!prefix || bare.indexOf(prefix)===0) keys.push(bare);
        }
      }
      return {keys, prefix, shared:false};
    }
  };
}

// 구글 시트(Apps Script 웹앱)를 백엔드로 쓰는 저장소 — 모든 사용자·모든 기기에서 공유됨
function makeSheetsStorageShim(baseUrl){
  async function getReq(params){
    const qs = new URLSearchParams(params).toString();
    const res = await fetch(baseUrl + '?' + qs, { method:'GET' });
    if(!res.ok) throw new Error('sheets GET failed: '+res.status);
    return res.json();
  }
  async function postReq(body){
    // Content-Type을 text/plain으로 보내야 CORS 프리플라이트를 피할 수 있음 (Apps Script는 preflight 미지원)
    const res = await fetch(baseUrl, {
      method:'POST',
      headers: {'Content-Type':'text/plain;charset=utf-8'},
      body: JSON.stringify(body),
    });
    if(!res.ok) throw new Error('sheets POST failed: '+res.status);
    return res.json();
  }
  return {
    async get(key){
      const data = await getReq({action:'get', key});
      if(data.error) throw new Error(data.error);
      return {key: data.key, value: data.value, shared:true};
    },
    async set(key, value){
      const data = await postReq({action:'set', key, value});
      if(data.error) throw new Error(data.error);
      return {key: data.key, value: data.value, shared:true};
    },
    async delete(key){
      const data = await postReq({action:'delete', key});
      if(data.error) throw new Error(data.error);
      return {key: data.key, deleted: data.deleted, shared:true};
    },
    async list(prefix){
      const data = await getReq({action:'list', prefix: prefix||''});
      if(data.error) throw new Error(data.error);
      return {keys: data.keys||[], prefix, shared:true};
    }
  };
}

const STORAGE = STORAGE_MODE==='sheets' ? makeSheetsStorageShim(APPS_SCRIPT_URL)
  : (STORAGE_MODE==='claude') ? window.storage : makeLocalStorageShim();

        migrated[k] = {manager: v.manager||null, director: v.director||null};
      }else if(v){
        migrated[k] = {manager: v, director: null}; // 과거 평가는 담당자 평가로 간주
      }
    });
    SUMMARY = migrated;
  }catch(e){ SUMMARY = {}; }
}
async function saveSummary(){
  try{ await STORAGE.set('summary:latest', JSON.stringify(SUMMARY), true); return true; }
  catch(e){ return false; }
}
async function loadHistory(branchName){
  try{
    const r = await STORAGE.get('eval:'+branchName, true);
    return JSON.parse(r.value);
  }catch(e){ return []; }
}
async function pushHistory(branchName, evalObj){
  const hist = await loadHistory(branchName);
  hist.unshift(evalObj);
  try{
    await STORAGE.set('eval:'+branchName, JSON.stringify(hist), true);
    return true;
  }catch(e){ return false; }
}

/* =====================================================================
   유틸
===================================================================== */
function getManagerList(){
  return Array.from(new Set(BRANCHES.map(b=>b.manager).filter(Boolean))).sort();
}
function getBranch(name){ return BRANCHES.find(b=>b.name===name); }
function todayStr(){
  const d = new Date();
  return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');
}
function band(score){
  if(score===null||score===undefined) return {label:'미평가', tone:'grey'};
  if(score>=85) return {label:'우수', tone:'jade'};
  if(score>=70) return {label:'양호', tone:'amber'};
  return {label:'위험', tone:'red'};
}
// 지점별 원장/담당자 평가를 하나의 종합 점수로 결합 (둘 다 있으면 평균, 하나만 있으면 그 값)
function combinedScore(entry){
  if(!entry) return null;
  const d = entry.director && entry.director.score!=null ? entry.director.score : null;
  const m = entry.manager && entry.manager.score!=null ? entry.manager.score : null;
  if(d!=null && m!=null) return Math.round((d+m)/2);
  if(d!=null) return d;
  if(m!=null) return m;
  return null;
}
// 원장 자가평가와 담당자 평가 간 격차(%p). 둘 다 있어야 계산됨, 없으면 null
function scoreGap(entry){
  if(!entry) return null;
  const d = entry.director && entry.director.score!=null ? entry.director.score : null;
  const m = entry.manager && entry.manager.score!=null ? entry.manager.score : null;
  if(d==null || m==null) return null;
  return Math.abs(d-m);
}
function escapeHtml(s){
  return String(s).replace(/[&<>"']/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}
function stampHtml(score, size){
  const b = band(score);
  const sizeClass = size==='lg'?'stamp-lg':(size==='md'?'stamp-md':'stamp-sm');
  const num = (score===null||score===undefined) ? '–' : (Math.round(score)+'%');
  return '<div class="stamp '+sizeClass+' tone-'+b.tone+'"><span class="stamp-num">'+num+'</span><span class="stamp-label">'+b.label+'</span></div>';
}
function toast(msg){
  const el = document.getElementById('toast');
  el.textContent = msg;
  el.classList.add('show');
  clearTimeout(window.__toastTimer);
  window.__toastTimer = setTimeout(()=>el.classList.remove('show'), 2200);
}

/* =====================================================================
   렌더: 앱 셸
===================================================================== */
function overallStats(){
  const total = BRANCHES.length;
  const combinedByBranch = {};
  Object.keys(SUMMARY).forEach(k=>{ combinedByBranch[k] = combinedScore(SUMMARY[k]); });
  const evaluated = Object.keys(combinedByBranch).filter(k=>combinedByBranch[k]!==null);
  const scores = evaluated.map(k=>combinedByBranch[k]);
  const avg = scores.length ? Math.round(scores.reduce((a,b)=>a+b,0)/scores.length) : null;
  const risk = evaluated.filter(k=>combinedByBranch[k]<70).length;
  const unevaluated = total - evaluated.length;
  const bothDone = Object.keys(SUMMARY).filter(k=>SUMMARY[k] && SUMMARY[k].manager && SUMMARY[k].director).length;
  const gapAlerts = Object.keys(SUMMARY).filter(k=>{ const g=scoreGap(SUMMARY[k]); return g!==null && g>=GAP_THRESHOLD; }).length;
  return {total, evaluatedCount:evaluated.length, avg, risk, unevaluated, bothDone, gapAlerts};
}

function exportCsv(){
  const rows = [['지점','담당자','유형','원장자가평가(%)','원장평가일','담당자평가(%)','담당자평가일','격차(%p)','종합상태']];
  document.querySelectorAll('#dash-tbody tr').forEach(tr=>{
    if(tr.style.display==='none') return;
    const name = tr.dataset.branch;
    const entry = SUMMARY[name];
    const d = entry && entry.director ? entry.director : null;
    const m = entry && entry.manager ? entry.manager : null;
    const gap = scoreGap(entry);
    rows.push([
      name, tr.dataset.manager,
      tr.dataset.type==='0'?'미지정':('유형 '+tr.dataset.type),
      d? d.score : '', d? d.date : '',
      m? m.score : '', m? m.date : '',
      gap===null?'':gap,
      tr.dataset.status
    ]);
  });
  const csv = rows.map(r=>r.map(v=>'"'+String(v).replace(/"/g,'""')+'"').join(',')).join('\n');
  const blob = new Blob(['\uFEFF'+csv], {type:'text/csv;charset=utf-8;'});
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url; a.download = '클리닉_준수현황_'+todayStr()+'.csv';
  document.body.appendChild(a); a.click(); document.body.removeChild(a);
  URL.revokeObjectURL(url);
  toast('CSV 파일이 다운로드되었습니다');
}

function sparklineSvg(entries){
  if(entries.length<2){
    return `<div class="muted" style="font-size:12.5px;">추이를 표시하려면 평가가 2회 이상 필요합니다.</div>`;
  }
  const scores = entries.map(e=>e.score===null||e.score===undefined?0:e.score);
  const dates = entries.map(e=>{
    const parts = (e.date||'').split('-');
    return parts.length===3 ? (parts[1]+'/'+parts[2]) : (e.date||'');
  });
  const w=460, padTop=24, padBottom=8, dateArea=16, padX=16;
  const h=116;
  const plotBottom = h - padBottom - dateArea;
  const plotHeight = plotBottom - padTop;
  const max=100,min=0;
  const step = (w-padX*2)/(scores.length-1);
  const bandColor = (s)=> s>=85?'#2C6E5C':(s>=70?'#A8752B':'#AB4234');
  const pts = scores.map((s,i)=>{
    const x = padX+i*step;
    const y = padTop + (1-(s-min)/(max-min))*plotHeight;
    return [x,y,s];
  });
  const path = pts.map((p,i)=>(i===0?'M':'L')+p[0].toFixed(1)+','+p[1].toFixed(1)).join(' ');
  const last = pts[pts.length-1];
  const lineColor = bandColor(last[2]);
  const dots = pts.map((p,i)=>{
    const isLast = i===pts.length-1;
    const c = bandColor(p[2]);
    const r = isLast?3.6:2.4;
    return `<circle cx="${p[0].toFixed(1)}" cy="${p[1].toFixed(1)}" r="${r}" fill="${c}"/>`
      + `<text x="${p[0].toFixed(1)}" y="${(p[1]-8).toFixed(1)}" text-anchor="middle" font-size="10" font-weight="700" fill="${c}" font-family="'Noto Sans KR',sans-serif">${Math.round(p[2])}%</text>`
      + `<text x="${p[0].toFixed(1)}" y="${h-4}" text-anchor="middle" font-size="8.5" fill="#8A93A3" font-family="'Noto Sans KR',sans-serif">${escapeHtml(dates[i])}</text>`;
  }).join('');
  return `<svg viewBox="0 0 ${w} ${h}" style="width:100%; height:${h}px;">
    <line x1="${padX}" y1="${padTop+(1-0.7)*plotHeight}" x2="${w-padX}" y2="${padTop+(1-0.7)*plotHeight}" stroke="#E3E7ED" stroke-dasharray="3,3"/>
    <path d="${path}" fill="none" stroke="${lineColor}" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/>
    ${dots}
  </svg>`;
}

  const total = flatChecklist(EVAL_DRAFT.type).length;
  const done = Object.keys(EVAL_DRAFT.items).length;
  const pct = total? Math.round(done/total*100):0;
  if(fillEl) fillEl.style.width = pct+'%';
  if(textEl) textEl.textContent = done+' / '+total+' 항목 입력됨';

async function submitEval(){
  const submitBtn = document.getElementById('eval-submit');
  submitBtn.disabled = true; submitBtn.textContent = '저장 중…';

  const br = getBranch(EVAL_DRAFT.branch);
  if(!br.type && EVAL_DRAFT.type){
    br.type = EVAL_DRAFT.type;
    await saveBranches();
  }

  const items = EVAL_DRAFT.items;
  let pass=0, fail=0, na=0;
  const failedLabels=[];
  flatChecklist(EVAL_DRAFT.type).forEach(it=>{
    const v = items[it.id];
    if(v==='pass') pass++;
    else if(v==='fail'){ fail++; failedLabels.push(it.label); }
    else na++;
  });
  const denom = pass+fail;
  const score = denom>0 ? Math.round(pass/denom*100) : null;

  // 항목 스냅샷 저장: 이후 체크리스트가 다시 개정되어도 이 기록의 항목·문구가 바뀌지 않도록 보존
  const itemsSnapshot = flatChecklist(EVAL_DRAFT.type).map(it=>({
    id: it.id, cat: it.cat, label: it.label, desc: it.desc, value: items[it.id] || 'na',
  }));

  const evalObj = {
    id: 'ev_'+Date.now()+'_'+Math.random().toString(36).slice(2,7),
    role: EVAL_DRAFT.role,
    date: EVAL_DRAFT.date,
    evaluator: EVAL_DRAFT.evaluator,
    type: EVAL_DRAFT.type,
    items: items,
    itemsSnapshot: itemsSnapshot,
    note: EVAL_DRAFT.note,
    score: score,
    passCount: pass, failCount: fail, naCount: na,
  };

  const ok = await pushHistory(EVAL_DRAFT.branch, evalObj);
  if(!SUMMARY[EVAL_DRAFT.branch]) SUMMARY[EVAL_DRAFT.branch] = {manager:null, director:null};
  const prevCount = (SUMMARY[EVAL_DRAFT.branch][EVAL_DRAFT.role] && SUMMARY[EVAL_DRAFT.branch][EVAL_DRAFT.role].count) || 0;
  SUMMARY[EVAL_DRAFT.branch][EVAL_DRAFT.role] = {
    date: EVAL_DRAFT.date, evaluator: EVAL_DRAFT.evaluator, type: EVAL_DRAFT.type,
    score: score, count: prevCount+1, failedLabels: failedLabels,
  };
  await saveSummary();

  if(ok){
    toast(EVAL_DRAFT.branch+' · '+ROLE_INFO[EVAL_DRAFT.role].label+'가 저장되었습니다');
  }else{
    toast('저장 중 문제가 발생했습니다. 다시 시도해 주세요');
  }
  EVAL_DRAFT = null;
  renderShell(); CURRENT_TAB='dashboard'; renderShell(); renderCurrentView();
}

/* =====================================================================
   엑셀 업로드로 담당자·유형 일괄 반영
   '공간 인력' 탭의 지점명/담당자/공간 여력 구분/인력 여력 구분 열을 읽어
   공간O+인력O→유형1, 공간X+인력O→유형2, 공간O+인력X→유형3, 공간X+인력X→유형4 로 매핑
===================================================================== */
async function applyExcelToBranches(file){
  const buf = await file.arrayBuffer();
  const wb = XLSX.read(buf, {type:'array'});
  const sheetName = wb.SheetNames.find(n => n.replace(/\s/g,'') === '공간인력') || wb.SheetNames[0];
  const ws = wb.Sheets[sheetName];
  const rows = XLSX.utils.sheet_to_json(ws, {defval:null});

  let matched=0, managerChanged=0, typeChanged=0, skipped=0;
  const unmatched=[];

  rows.forEach(row=>{
    const name = row['지점명'] ? String(row['지점명']).trim() : '';
    if(!name){ skipped++; return; }
    const spaceVal = row['공간 여력 구분'] ? String(row['공간 여력 구분']).trim() : '';
    const staffVal = row['인력 여력 구분'] ? String(row['인력 여력 구분']).trim() : '';
    if(!spaceVal || !staffVal){ skipped++; return; } // 합계 행 등 데이터 없는 행 제외

    const br = getBranch(name);
    if(!br){ unmatched.push(name); return; }

    let newType = null;
    if(spaceVal==='공간O' && staffVal==='인력O') newType = 1;
    else if(spaceVal==='공간X' && staffVal==='인력O') newType = 2;
    else if(spaceVal==='공간O' && staffVal==='인력X') newType = 3;
    else if(spaceVal==='공간X' && staffVal==='인력X') newType = 4;
    if(newType===null){ skipped++; return; }

    const mgr = row['담당자'] ? String(row['담당자']).trim() : '';
    if(mgr && mgr !== br.manager){ br.manager = mgr; managerChanged++; }
    if(newType !== br.type){ br.type = newType; typeChanged++; }
    matched++;
  });

  return {total: rows.length, matched, managerChanged, typeChanged, skipped, unmatched};
}

    </div>
    <div class="card">
      <div class="settings-note"><b>안내</b> — 담당자 배정과 지점 유형은 언제든 변경될 수 있습니다. 위 엑셀 업로드로 일괄 반영하거나, 아래 표에서 담당자가 직접 수정할 수도 있습니다. 변경 후 반드시 하단의 <b>전체 저장</b> 버튼을 눌러야 반영됩니다.</div>
      <div class="filter-bar" style="padding-top:0;">
        <input type="text" id="s-search" placeholder="지점명 검색" style="min-width:180px;">
        <select id="s-manager"><option value="">담당자 전체</option>${managers.map(m=>`<option value="${escapeHtml(m)}">${escapeHtml(m)}</option>`).join('')}</select>
        <div class="spacer"></div>
        <button class="btn btn-gold" id="s-save" disabled>전체 저장</button>
      </div>
      <datalist id="manager-list">${managers.map(m=>`<option value="${escapeHtml(m)}">`).join('')}</datalist>
      <div style="overflow-x:auto;">
      <table class="data" id="settings-table">
        <thead><tr><th>지점</th><th style="width:220px;">담당자</th><th style="width:150px;">유형</th></tr></thead>
        <tbody id="settings-tbody"></tbody>
      </table>
      </div>
    </div>
  `;

  const tbody = document.getElementById('settings-tbody');
  const sorted = BRANCHES.slice().sort((a,b)=> (a.manager||'').localeCompare(b.manager||'','ko') || a.name.localeCompare(b.name,'ko'));
  tbody.innerHTML = sorted.map(br=>`
    <tr data-branch="${escapeHtml(br.name)}" data-manager-row="${escapeHtml(br.manager||'')}">
      <td class="branch-name">${escapeHtml(br.name)}</td>
      <td><input class="inline-text" list="manager-list" data-field="manager" data-branch="${escapeHtml(br.name)}" value="${escapeHtml(br.manager||'')}"></td>
      <td>
        <select class="inline-select" data-field="type" data-branch="${escapeHtml(br.name)}">
          <option value="0" ${!br.type?'selected':''}>미지정</option>
          <option value="1" ${br.type===1?'selected':''}>유형 1</option>
          <option value="2" ${br.type===2?'selected':''}>유형 2</option>
          <option value="3" ${br.type===3?'selected':''}>유형 3</option>
          <option value="4" ${br.type===4?'selected':''}>유형 4</option>
        </select>
      </td>
    </tr>
  `).join('');

  function markDirty(){
    SETTINGS_DIRTY = true;
    document.getElementById('s-save').disabled = false;
    const slot = document.getElementById('settings-dirty-slot');
    slot.innerHTML = `<div class="dirty-banner"><span>저장하지 않은 변경사항이 있습니다.</span></div>`;
  }

  document.getElementById('toggle-criteria').addEventListener('click', ()=>{
    const box = document.getElementById('criteria-box');
    box.style.display = box.style.display==='none' ? 'block' : 'none';
  });

  document.getElementById('excel-upload-input').addEventListener('change', async (e)=>{
    const file = e.target.files[0];
    if(!file) return;
    const statusEl = document.getElementById('excel-upload-status');
    statusEl.textContent = '엑셀을 읽는 중…'; statusEl.style.color = 'var(--ink-faint)';
    try{
      const result = await applyExcelToBranches(file);
      statusEl.style.color = 'var(--jade)';
      statusEl.textContent = `총 ${result.total}개 행 중 ${result.matched}개 지점 반영 완료 (담당자 변경 ${result.managerChanged}건, 유형 변경 ${result.typeChanged}건)`
        + (result.unmatched.length ? ` · 지점명 불일치 ${result.unmatched.length}건: ${result.unmatched.join(', ')}` : '')
        + (result.skipped ? ` · 합계/빈 행 등 제외 ${result.skipped}건` : '');
      if(result.matched>0){
        markDirty();
        renderSettingsTab(); // 표를 새 값으로 다시 그림 (업로드 상태 메시지는 사라지므로 아래서 다시 표시)
        const s2 = document.getElementById('excel-upload-status');
        s2.style.color = 'var(--jade)';
        s2.textContent = statusEl.textContent;
      }
    }catch(err){
      statusEl.style.color = 'var(--red)';
      statusEl.textContent = '엑셀을 읽는 중 오류가 발생했습니다: '+err.message+' ("공간 인력" 탭이 있는 파일인지 확인해주세요)';
    }
    e.target.value = ''; // 같은 파일을 다시 선택해도 change 이벤트가 발생하도록 초기화
  });

  tbody.addEventListener('change', (e)=>{
    const field = e.target.dataset.field;
    if(!field) return;
    const branchName = e.target.dataset.branch;
    const br = getBranch(branchName);
    if(!br) return;
    if(field==='manager'){ br.manager = e.target.value.trim(); }
    else if(field==='type'){ const v = parseInt(e.target.value,10); br.type = v===0? null : v; }
    markDirty();
  });

  document.getElementById('s-save').addEventListener('click', async ()=>{
    const btn = document.getElementById('s-save');
    btn.disabled = true; btn.textContent='저장 중…';
    const ok = await saveBranches();
    SETTINGS_DIRTY = false;
    document.getElementById('settings-dirty-slot').innerHTML = '';
    btn.textContent='전체 저장';
    toast(ok? '지점 설정이 저장되었습니다' : '저장 중 문제가 발생했습니다');
    renderSettingsTab();
  });

  function applyFilter(){
    const q = document.getElementById('s-search').value.trim().toLowerCase();
    const mgr = document.getElementById('s-manager').value;
    tbody.querySelectorAll('tr').forEach(tr=>{
      const name = tr.dataset.branch.toLowerCase();
      const okQ = !q || name.includes(q);
      const okM = !mgr || tr.dataset.managerRow===mgr;
      tr.style.display = (okQ&&okM) ? '' : 'none';
    });
  }
  document.getElementById('s-search').addEventListener('input', applyFilter);
  document.getElementById('s-manager').addEventListener('change', applyFilter);
}

/* =====================================================================
   초기화
===================================================================== */
async function init(){
  await Promise.all([loadBranches(), loadSummary()]);
  renderShell();
  renderCurrentView();
}
init();
</script>
</body>
</html>
